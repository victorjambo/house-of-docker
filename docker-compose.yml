services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=supply_chain_local
      - MYSQL_USER=supply_chain
      - MYSQL_PASSWORD=password

    ports:
      - "3306:3306"
    volumes:
      - "${MYSQL_VOLUME_DIR:-./volume}:/var/lib/mysqld"
      - "/var/run/docker.sock:/var/run/docker.sock"

  hashicorp:
    image: hashicorp/vault:1.21
    container_name: hashicorp
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_ADDR=http://127.0.0.1:8200
      - VAULT_TOKEN=root
    ports:
      - "8200:8200"
    restart: unless-stopped
    command:
      sh -c "vault server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200 &
      sleep 5 &&
      VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault secrets enable transit &&
      wait"
    volumes:
      - hashicorp-vault-data:/vault/file

  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
      IPFS_PATH: /data/ipfs
    ports:
      # Swarm
      - "4001:4001/tcp"
      - "4001:4001/udp"
      # API
      - "5001:5001"
      # Gateway
      - "8080:8080"
    volumes:
      - ./ipfs/data:/data/ipfs
      - ./ipfs/staging:/export

  redis:
    image: redis:latest
    container_name: gas-station-redis
    volumes:
      - redis_data:/data

  gas-station:
    image: iotaledger/gas-station:0.3.1
    container_name: iota-gas-station
    command: ["--config-path", "/app/gas-station-config.yaml"]
    depends_on:
      - redis
    ports:
      - "9527:9527" # RPC port
      - "9184:9184" # Metrics port
    environment:
      - CONFIG_PATH=/app/gas-station-config.yaml
      - RUST_BACKTRACE=1
      - GAS_STATION_AUTH=token
    volumes:
      - ${LOCAL_CONFIG_PATH:-./gas-station-config.yaml}:/app/gas-station-config.yaml

volumes:
  hashicorp-vault-data:
  redis_data:
