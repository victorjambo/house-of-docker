services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=zf3fEAHjRcJwvEDenmN7
      - MYSQL_DATABASE=tlip_staging
      - MYSQL_USER=tlip_staging
      - MYSQL_PASSWORD=zf3fEAHjRcJwvEDenmN7

    ports:
      - "3306:3306"
    volumes:
      - "${MYSQL_VOLUME_DIR:-./volume}:/var/lib/mysqld"
      - "/var/run/docker.sock:/var/run/docker.sock"

  hashicorp:
    image: hashicorp/vault:1.21
    container_name: hashicorp
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_ADDR=http://127.0.0.1:8200
      - VAULT_TOKEN=root
    ports:
      - "8200:8200"
    restart: unless-stopped
    command: server -dev
    volumes:
      - hashicorp-vault-data:/vault/file

  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
      IPFS_PATH: /data/ipfs
    ports:
      # Swarm
      - "4001:4001/tcp"
      - "4001:4001/udp"
      # API
      - "5001:5001"
      # Gateway
      - "8080:8080"
    volumes:
      - ./ipfs/data:/data/ipfs
      - ./ipfs/staging:/export


volumes:
  postgres_data:
  hashicorp-vault-data:
